<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1240" height="600" fill="#ffffff" rx="8"/>
  <text x="24" y="36" font-size="20" font-weight="600" fill="#111827">Ionos SDR mini - system architecture</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">stock Silicon Labs radio board + ESP32-S3 DevKitC carrier - no custom RF, both displays optional</text>
  <rect x="24" y="86" width="250" height="440" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="40" y="112" font-size="14" font-weight="600" fill="#9a3412">Silicon Labs radio board</text>
  <text x="40" y="130" font-size="11" fill="#9a3412">BRD4265B - FG23, 434 MHz, 10 dBm</text>
  <g stroke="#9a3412" stroke-width="2" fill="none">
    <line x1="70" y1="212" x2="70" y2="170"/>
    <line x1="70" y1="170" x2="52" y2="150"/>
    <line x1="70" y1="170" x2="88" y2="150"/>
    <line x1="70" y1="170" x2="70" y2="148"/>
  </g>
  <text x="52" y="230" font-size="11" fill="#9a3412">SMA</text>
  <rect x="116" y="158" width="142" height="46" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text x="187" y="178" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">Sub-GHz matching</text>
  <text x="187" y="194" font-size="10" fill="#7c2d12" text-anchor="middle">on the panel, not ours</text>
  <rect x="48" y="252" width="210" height="60" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text x="153" y="274" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">EFR32FG23 SoC</text>
  <text x="153" y="292" font-size="10" fill="#7c2d12" text-anchor="middle">I/Q capture, NCO TX, 39 MHz XO</text>
  <rect x="48" y="336" width="210" height="52" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text x="153" y="357" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">M24C02 board ID</text>
  <text x="153" y="373" font-size="10" fill="#7c2d12" text-anchor="middle">panel auto-detect over I2C</text>
  <rect x="48" y="410" width="210" height="52" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text x="153" y="431" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">internal DC-DC, PAVDD</text>
  <text x="153" y="447" font-size="10" fill="#7c2d12" text-anchor="middle">single supply pin: VMCU_IN</text>
  <rect x="300" y="150" width="56" height="330" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="328" y="315" font-size="12" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 328 315)">2 x 2x20 mezzanine, 1.27 mm</text>
  <rect x="382" y="86" width="600" height="440" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="112" font-size="14" font-weight="600" fill="#334155">Ionos SDR mini carrier</text>
  <text x="400" y="130" font-size="11" fill="#64748b">168 x 80 mm, 2-layer</text>
  <rect x="404" y="150" width="250" height="86" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="529" y="176" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">ESP32-S3 DevKitC N16R8</text>
  <text x="529" y="196" font-size="10" fill="#1e40af" text-anchor="middle">SPI2 slave on IO_MUX, FFT waterfall,</text>
  <text x="529" y="212" font-size="10" fill="#1e40af" text-anchor="middle">streaming server, SWD bit-bang</text>
  <text x="529" y="228" font-size="10" fill="#1e40af" text-anchor="middle">on 2x22 female headers</text>
  <rect x="404" y="266" width="250" height="60" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="529" y="288" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">LP5907 3.3 V LDO</text>
  <text x="529" y="306" font-size="10" fill="#047857" text-anchor="middle">low noise, off the DevKit 5 V rail</text>
  <rect x="404" y="356" width="250" height="60" rx="6" fill="#faf5ff" stroke="#a855f7"/>
  <text x="529" y="378" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">6 buttons, 2 ADC ladders</text>
  <text x="529" y="396" font-size="10" fill="#7e22ce" text-anchor="middle">cursor keys + BACK / OK</text>
  <rect x="404" y="444" width="250" height="60" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="529" y="466" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">SWD bootstrap flashing</text>
  <text x="529" y="484" font-size="10" fill="#b91c1c" text-anchor="middle">blank panel programmed by the ESP32</text>
  <rect x="700" y="150" width="262" height="86" rx="6" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="831" y="176" font-size="12" font-weight="600" fill="#115e59" text-anchor="middle">2.4 inch ILI9341 TFT (optional)</text>
  <text x="831" y="194" font-size="10" fill="#0f766e" text-anchor="middle">SPI3 + TE, tear-free waterfall</text>
  <text x="831" y="212" font-size="10" fill="#0f766e" text-anchor="middle">resistive or capacitive touch</text>
  <rect x="700" y="266" width="262" height="60" rx="6" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="831" y="288" font-size="12" font-weight="600" fill="#115e59" text-anchor="middle">0.96 inch OLED (optional)</text>
  <text x="831" y="306" font-size="10" fill="#0f766e" text-anchor="middle">I2C, shared with board ID</text>
  <rect x="700" y="356" width="262" height="60" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="831" y="378" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">USB-C on the DevKit</text>
  <text x="831" y="396" font-size="10" fill="#4338ca" text-anchor="middle">power + I/Q stream, one cable</text>
  <rect x="1000" y="150" width="216" height="140" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1108" y="178" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Host</text>
  <text x="1108" y="200" font-size="11" fill="#374151" text-anchor="middle">SDR++, GNU Radio, GQRX</text>
  <text x="1108" y="222" font-size="10" fill="#6b7280" text-anchor="middle">USB CDC or WiFi</text>
  <text x="1108" y="244" font-size="10" fill="#6b7280" text-anchor="middle">SpyServer protocol</text>
  <line x1="258" y1="270" x2="404" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="332" y="212" font-size="10" fill="#374151" text-anchor="middle">I/Q + FFT lines</text>
  <text x="332" y="226" font-size="10" fill="#6b7280" text-anchor="middle">SPI2, IO_MUX</text>
  <line x1="404" y1="206" x2="258" y2="292" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="332" y="272" font-size="10" fill="#6b7280" text-anchor="middle">RDY, CMD (UART)</text>
  <line x1="404" y1="470" x2="258" y2="366" stroke="#ef4444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="430" font-size="10" fill="#b91c1c" text-anchor="middle">SWDIO / SWCLK / RESET</text>
  <line x1="404" y1="296" x2="258" y2="436" stroke="#15803d" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="332" y="352" font-size="10" fill="#15803d" text-anchor="middle">VMCU_IN, 3.3 V</text>
  <line x1="654" y1="186" x2="700" y2="186" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="654" y1="292" x2="700" y2="292" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="677" y="284" font-size="9" fill="#6b7280" text-anchor="middle">I2C</text>
  <line x1="654" y1="386" x2="700" y2="386" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="962" y1="380" x2="1108" y2="380" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="1108" y1="380" x2="1108" y2="292" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1035" y="370" font-size="10" fill="#374151" text-anchor="middle">USB / WiFi</text>
</svg>
